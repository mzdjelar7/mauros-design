<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{
  --bg:#f3f2ef;--card:#ffffff;--card2:#f7f6f3;--ink:#111111;--ink2:#4b4b4f;--mute:#8e8e93;--line:#e9e6e0;
  --acc:#111111;--accInk:#ffffff;--red:#e10600;--redBg:#fde8e7;--green:#15803d;--greenBg:#e3f5e9;
  --amber:#b45309;--amberBg:#fdf1dc;--blue:#1d4ed8;--blueBg:#e4ebfd;--teal:#0e7490;--tealBg:#dff4f8;
  --violet:#6d28d9;--violetBg:#eee8fc;--r:18px;--rs:12px;
  --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);--tab:62px;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0c0c0e;--card:#17171a;--card2:#1f1f23;--ink:#f4f4f5;--ink2:#c2c2c7;--mute:#85858c;--line:#2a2a2f;
  --acc:#ffffff;--accInk:#111111;--redBg:#3a1513;--greenBg:#12301d;--amberBg:#35260f;--blueBg:#172446;--tealBg:#0f2d33;--violetBg:#271a45;
  --shadow:none;}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;overscroll-behavior:none}
body{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
/* header */
#hdr{padding:calc(var(--st) + 10px) 18px 8px;background:var(--bg);display:flex;align-items:flex-end;gap:10px;flex-shrink:0}
#hdr h1{font-size:28px;font-weight:800;letter-spacing:-.6px;flex:1;line-height:1.1}
#hdr .sub{font-size:12px;color:var(--mute);font-weight:500;margin-top:2px}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink2);background:var(--card);border:1px solid var(--line);padding:6px 10px;border-radius:20px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.dot.wait{background:var(--amber);animation:pulse 1s infinite}.dot.err{background:var(--red)}
@keyframes pulse{50%{opacity:.3}}
.iconbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font-size:17px}
/* views */
#views{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:4px 0 calc(var(--tab) + var(--sb) + 90px);display:none}
.view.on{display:block}
#v-board{padding:0;overflow:hidden}
#v-board.on{display:flex;flex-direction:column}
/* tabs */
#tabs{flex-shrink:0;display:flex;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--sb);height:calc(var(--tab) + var(--sb))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--mute);position:relative}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--ink)}
.tab .badge{position:absolute;top:6px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:1px 5px;min-width:17px;text-align:center}
#fab{position:fixed;right:18px;bottom:calc(var(--tab) + var(--sb) + 16px);width:56px;height:56px;border-radius:18px;background:var(--acc);color:var(--accInk);font-size:28px;font-weight:300;box-shadow:0 8px 24px rgba(0,0,0,.22);z-index:20;display:grid;place-items:center}
/* blocks */
.sec{padding:0 16px;margin-top:18px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 8px}
.sec-h h2{font-size:17px;font-weight:700;letter-spacing:-.2px}
.sec-h a,.link{font-size:13px;font-weight:600;color:var(--blue)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden}
.pad{padding:14px 16px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;text-align:left;box-shadow:var(--shadow);position:relative;min-height:84px}
.kpi:active{transform:scale(.98)}
.kpi .l{font-size:12px;font-weight:600;color:var(--mute)}
.kpi .v{font-size:25px;font-weight:800;letter-spacing:-.8px;margin-top:4px}
.kpi .s{font-size:11.5px;color:var(--mute);margin-top:2px}
.kpi .chev{position:absolute;right:12px;top:12px;color:var(--mute);font-size:13px}
.v.red{color:var(--red)}.v.green{color:var(--green)}.v.amber{color:var(--amber)}.v.blue{color:var(--blue)}
.delta{font-size:11px;font-weight:700;padding:1px 6px;border-radius:8px;margin-left:4px}
.delta.up{background:var(--greenBg);color:var(--green)}.delta.dn{background:var(--redBg);color:var(--red)}
/* rows */
.row{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:flex-start;text-align:left;width:100%}
.row:last-child{border-bottom:none}
.row:active{background:var(--card2)}
.av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:14px;flex-shrink:0}
.rm{flex:1;min-width:0}
.rt{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.rt b{font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{font-weight:700;font-size:14px;white-space:nowrap}
.rs{font-size:13px;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.pill{font-size:11px;font-weight:650;padding:3px 8px;border-radius:20px;white-space:nowrap;background:var(--card2);color:var(--ink2)}
.p-red{background:var(--redBg);color:var(--red)}.p-green{background:var(--greenBg);color:var(--green)}.p-amber{background:var(--amberBg);color:var(--amber)}
.p-blue{background:var(--blueBg);color:var(--blue)}.p-teal{background:var(--tealBg);color:var(--teal)}.p-violet{background:var(--violetBg);color:var(--violet)}
.blink{animation:pulse 1.2s infinite}
/* chips */
.hscroll{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 10px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:8px 13px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap}
.chip.on{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.chip .n{opacity:.6;margin-left:4px;font-weight:700}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;margin:0 16px 12px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-size:13px;font-weight:650;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.search{margin:0 16px 10px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px}
.search input{flex:1;border:none;background:none;padding:12px 0;font-size:15px;outline:none}
.empty{text-align:center;color:var(--mute);padding:34px 16px;font-size:14px}
.more{width:100%;padding:14px;font-weight:650;color:var(--blue);font-size:14px}
/* board */
#bchips{flex-shrink:0;padding-top:4px}
#btrack{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
#btrack::-webkit-scrollbar{display:none}
.bcol{flex:0 0 100%;scroll-snap-align:center;overflow-y:auto;padding:2px 16px calc(var(--tab) + var(--sb) + 40px);-webkit-overflow-scrolling:touch}
.bhead{display:flex;align-items:center;gap:8px;margin:4px 4px 10px;font-weight:700;font-size:15px}
.bhead .cnt{color:var(--mute);font-weight:600}
.bcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:9px;box-shadow:var(--shadow);position:relative;text-align:left;width:100%;display:block}
.bcard:active{transform:scale(.985)}
.bcard .more-btn{position:absolute;right:6px;top:6px;width:34px;height:34px;border-radius:10px;color:var(--mute);font-size:18px}
.pager{display:flex;justify-content:center;gap:5px;padding:2px 0 6px}
.pager i{width:6px;height:6px;border-radius:3px;background:var(--line);transition:all .2s}
.pager i.on{width:18px;background:var(--ink)}
/* screens */
.screen{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);box-shadow:-10px 0 30px rgba(0,0,0,.08)}
.screen.in{transform:none}
.shdr{padding:calc(var(--st) + 8px) 10px 8px;display:flex;align-items:center;gap:6px;flex-shrink:0;background:var(--bg)}
.shdr .t{flex:1;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{display:flex;align-items:center;gap:2px;font-weight:600;font-size:16px;color:var(--blue);padding:8px}
.sbody{flex:1;overflow-y:auto;padding-bottom:calc(var(--sb) + 110px)}
.hero{padding:6px 18px 4px}
.hero h2{font-size:24px;font-weight:800;letter-spacing:-.5px}
.hero .p{font-size:14px;color:var(--ink2);margin-top:3px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 16px 4px}
.act{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;font-weight:650;color:var(--ink2)}
.act .i{font-size:20px;line-height:1}
.act:active{background:var(--card2)}
.kv{display:flex;justify-content:space-between;gap:14px;padding:11px 16px;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--mute);flex-shrink:0}
.kv .vv{text-align:right;font-weight:550;word-break:break-word}
.kv .vv.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px}
.copy{color:var(--blue);font-weight:650;margin-left:6px}
/* form */
.fgroup{margin:16px 16px 0}
.fgroup h3{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin:0 4px 6px}
.field{display:flex;flex-direction:column;padding:9px 14px;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:none}
.field label{font-size:11.5px;color:var(--mute);font-weight:600}
.field input,.field select,.field textarea{border:none;background:none;outline:none;padding:4px 0 2px;font-size:16px;width:100%}
.field textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr}
.two .field:first-child{border-right:1px solid var(--line)}
.savebar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(var(--sb) + 12px);background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:45}
.btn{width:100%;padding:15px;border-radius:15px;background:var(--acc);color:var(--accInk);font-weight:700;font-size:16px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
/* sheet */
#sb{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
#sb.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:86vh;background:var(--card);border-radius:22px 22px 0 0;z-index:61;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-bottom:var(--sb)}
#sheet.on{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:9px auto 4px}
.sh-h{padding:6px 18px 10px;display:flex;align-items:center;gap:8px}
.sh-h h3{flex:1;font-size:18px;font-weight:750}
.sh-b{overflow-y:auto;padding:0 0 16px}
.opt{display:flex;align-items:center;gap:12px;padding:14px 18px;font-size:16px;font-weight:550;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:none}
.opt .sw{width:12px;height:12px;border-radius:50%}
.opt.sel{font-weight:750}
.opt .ck{margin-left:auto;color:var(--blue)}
/* report */
.bars .b{margin-bottom:10px}
.bars .bl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;gap:8px}
.bars .bl span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .bl b{font-weight:700;white-space:nowrap}
.track{height:8px;border-radius:5px;background:var(--card2);overflow:hidden}
.fill{height:100%;border-radius:5px;background:var(--ink)}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.note{font-size:12px;color:var(--mute);margin:8px 4px 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini{background:var(--card2);border-radius:12px;padding:10px;text-align:center}
.mini .v{font-size:18px;font-weight:800}
.mini .l{font-size:11px;color:var(--mute);font-weight:600;margin-top:2px}
/* toast, ptr, login */
#toast{position:fixed;left:50%;bottom:calc(var(--tab) + var(--sb) + 86px);transform:translateX(-50%) translateY(20px);background:#111;color:#fff;padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;transition:all .22s;z-index:90;max-width:88vw;text-align:center;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
#ptr{position:absolute;top:0;left:0;right:0;height:0;display:flex;align-items:flex-end;justify-content:center;font-size:12px;color:var(--mute);font-weight:600;overflow:hidden;z-index:5}
#login{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px}
#login.on{display:flex}
#login form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
#login img{width:120px;height:120px;margin:0 auto 8px;border-radius:24px}
#login input{padding:15px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);font-size:16px;outline:none}
#login .msg{min-height:18px;font-size:13px;color:var(--red);text-align:center}
.skel{height:76px;border-radius:var(--r);background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:10px}
@keyframes sk{to{background-position:-200% 0}}
</style>
</head>

async function authToken(grant, body) {

  if (!d.expires_at) d.expires_at = Math.floor(Date.now() / 1000) + (d.expires_in || 3600);

}
let _ref = null;
async function authEnsure() {

/* ═════════ PODACI – siguran sloj ═════════
   Pravila: ništa se ne briše; izmjene šalju SAMO promijenjena polja (PATCH);
   nove narudžbe su čisti INSERT (nikad ne prepisuju postojeće);
   svaka izmjena prvo ide u lokalni red (localStorage) i ostaje tamo dok baza ne potvrdi. */
async function rest(method, path, body, prefer) {
  if (!(await authEnsure())) { const e = new Error('Prijava potrebna'); e.auth = true; throw e; }
  const h = { apikey: KEY, Authorization: 'Bearer ' + S.access_token, 'Content-Type': 'application/json' };
  if (prefer) h.Prefer = prefer;
  const r = await fetch(SB + '/rest/v1/' + path, { method, headers: h, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { authSave(null); authShow('Prijava je istekla – prijavi se ponovno.'); const e = new Error('401'); e.auth = true; throw e; }
  const txt = await r.text(); let d = null; try { d = txt ? JSON.parse(txt) : null; } catch (e) {}
  if (!r.ok) { const e = new Error((d && (d.message || d.hint)) || ('HTTP ' + r.status)); e.status = r.status; e.code = d && d.code; throw e; }
  return d;
}
let D = { orders: LS.get('m5_orders', []), stock: LS.get('m5_stock', []), nabava: LS.get('m5_nabava', []), stanje: LS.get('m5_stanje', []), ads: LS.get('m5_ads', []) };
let Q = LS.get('m5_queue', []);
let lastSync = LS.get('m5_lastsync', null), loading = false, online = true;
function persist() { LS.set('m5_orders', D.orders); LS.set('m5_stock', D.stock); LS.set('m5_nabava', D.nabava); LS.set('m5_stanje', D.stanje); LS.set('m5_ads', D.ads); }
function saveQ() { if (!LS.set('m5_queue', Q)) toast('⚠ Memorija mobitela je puna – izmjena možda nije sačuvana lokalno!', 4000); }
const STATUS_MAP = { 'Printano': 'Print poslan', 'U pripremi': 'U izradi', 'Isporuceno': 'Isporučeno' };
function normalize() { D.orders.forEach(o => { if (STATUS_MAP[o.status]) o.status = STATUS_MAP[o.status]; }); }
function applyOp(op) {
  const arr = D[op.table === 'orders' ? 'orders' : op.table]; if (!arr) return;
  if (op.kind === 'patch') { const r = arr.find(x => String(x.id) === String(op.id)); if (r) Object.assign(r, op.patch); }
  if (op.kind === 'insert' && !arr.some(x => String(x.id) === String(op.row.id))) arr.unshift(Object.assign({}, op.row));
}
function enqueue(op) {
  op.qid = Date.now() + '-' + Math.random().toString(36).slice(2, 7); op.ts = new Date().toISOString();
  Q.push(op); saveQ(); applyOp(op); normalize(); persist(); renderAll(); flush();
}
const patchOrder = (id, patch) => enqueue({ kind: 'patch', table: 'orders', id: String(id), patch });
let flushing = false;
async function flush() {
  if (flushing || !Q.some(x => !x.failed)) { setSync(); return; }
  flushing = true; setSync();
  try {
    for (const op of Q.filter(x => !x.failed)) {
      try {
        if (op.kind === 'patch') {
          const res = await rest('PATCH', op.table + '?id=eq.' + encodeURIComponent(op.id), op.patch, 'return=representation');
          if (!Array.isArray(res) || !res.length) { op.failed = 'Zapis nije pronađen u bazi'; saveQ(); continue; }
        } else if (op.kind === 'insert') {
          try { await rest('POST', op.table, op.row, 'return=minimal'); }
          catch (e) { if (e.code !== '23505') throw e; } // već upisano ranije – OK
        }
        Q = Q.filter(x => x.qid !== op.qid); saveQ(); online = true;
      } catch (e) {
        if (e.auth || !e.status || e.status >= 500 || e.status === 429) { online = !!e.status; break; } // privremeno – pokušaj kasnije, NIŠTA se ne gubi
        op.failed = e.message; saveQ(); // trajna greška – ostaje vidljivo u redu
      }
    }
  } finally { flushing = false; setSync(); }
}
window.addEventListener('online', () => { online = true; flush(); loadAll(true); });
window.addEventListener('offline', () => { online = false; setSync(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { flush(); if (!lastSync || Date.now() - lastSync > 60000) loadAll(true); } });
setInterval(() => { if (Q.some(x => !x.failed)) flush(); }, 20000);

async function loadAll(silent) {
  if (loading) return; loading = true; setSync();
  try {
    const [o, s, n, st, a] = await Promise.all([
      rest('GET', 'orders?select=*&order=inserted_at.desc&limit=5000'),
      rest('GET', 'stock?select=*&limit=3000'),
      rest('GET', 'nabava?select=*&order=id.desc&limit=3000'),
      rest('GET', 'skladiste_stanje?select=*'),
      rest('GET', 'ad_costs?select=*&limit=1000')
    ]);
    if (Array.isArray(o) && (o.length || !D.orders.length)) D.orders = o;
    if (Array.isArray(s)) D.stock = s;
    if (Array.isArray(n)) D.nabava = n;
    if (Array.isArray(st)) D.stanje = st;
    if (Array.isArray(a)) D.ads = a;
    Q.forEach(applyOp); // izmjene koje još čekaju ostaju vidljive
    normalize(); persist(); online = true;
    lastSync = Date.now(); LS.set('m5_lastsync', lastSync);
    autoDelivered();
  } catch (e) { if (!e.auth) { online = false; if (!silent) toast('Nema veze s bazom – prikazujem spremljene podatke'); } }
  finally { loading = false; renderAll(); flush(); }
}

const BN_SENT = ['in-depot', 'in-transit', 'accepted-for-delivery', 'accepted-to-locker', 'in-final-destination', 'delivered'];
const bn = o => String(o.boxnow_status || '').toLowerCase();
const done = o => o.status === 'Poslano' || o.status === 'Isporučeno' || o.status === 'Otkazano';
const isFrame = o => /okvir/i.test(o.okvir || '');

function rokInfo(o) { if (!o.rok_isporuke) return null; const d = new Date(o.rok_isporuke); if (isNaN(d)) return null; d.setHours(0,0,0,0); return { d, diff: Math.round((d - today0()) / 864e5) }; }
const isLate = o => { if (shipped(o) || o.status === 'Otkazano') return false; const r = rokInfo(o); return !!r && r.diff < 0; };

function rokPill(o) {

  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));

function swipeBack(el) {
  let sx = 0, sy = 0, dx = 0, on = false, lock = null;
  el.addEventListener('touchstart', e => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; dx = 0; lock = null; on = !e.target.closest('.hscroll,input,textarea,select'); }, { passive: true });
  el.addEventListener('touchmove', e => {
    if (!on) return; const t = e.touches[0], x = t.clientX - sx, y = t.clientY - sy;
    if (lock === null && (Math.abs(x) > 10 || Math.abs(y) > 10)) lock = (x > 0 && Math.abs(x) > Math.abs(y) * 1.2) ? 'x' : 'y';
    if (lock === 'x') { dx = Math.max(0, x); el.style.transition = 'none'; el.style.transform = 'translateX(' + dx + 'px)'; }
  }, { passive: true });
  el.addEventListener('touchend', () => {
    if (!on || lock !== 'x') return; on = false; el.style.transition = 'transform .22s ease';
    if (dx > 80) { haptic(); closeTop(); } else el.style.transform = '';

}

  const lead = del.map(o => (new Date(o.boxnow_updated_at) - created(o)) / 864e5).filter(x => x >= 0 && x < 120);
  const stNow = ST.map(s => [s, l.filter(o => o.status === s).length, 0, STHEX[s]]).filter(r => r[1]);
  html += '<div class="sec"><div class="sec-h"><h2>Isporuka</h2></div><div class="card pad"><div class="grid3">'
    + '<div class="mini"><div class="v">' + del.length + '</div><div class="l">dostavljeno</div></div>'
    + '<div class="mini"><div class="v">' + (del.length ? Math.round(onTime.length / del.length * 100) + '%' : '—') + '</div><div class="l">na vrijeme</div></div>'
    + '<div class="mini"><div class="v">' + (lead.length ? Math.round(lead.reduce((s, x) => s + x, 0) / lead.length) + 'd' : '—') + '</div><div class="l">narudžba → dostava</div></div>'
    + '</div><div style="margin-top:14px">' + bars(stNow, r => r[1]) + '</div></div></div>';
  // plaćanja i kupci
  const paidN = l.filter(o => o.paid === 'Da').length;
  const allTimeCount = {}; D.orders.forEach(o => { const k = String(oname(o)).toLowerCase().trim(); if (!k || k === '—') return; const d = created(o); (allTimeCount[k] = allTimeCount[k] || []).push(d ? d.getTime() : 0); });
  const custs = [...new Set(l.map(o => String(oname(o)).toLowerCase().trim()))];
  const returning = custs.filter(c => (allTimeCount[c] || []).some(t => t < a.getTime())).length;
  const multi = custs.filter(c => l.filter(o => String(oname(o)).toLowerCase().trim() === c).length > 1).length;
  html += '<div class="sec"><div class="sec-h"><h2>Kupci i plaćanja</h2></div><div class="card pad"><div class="grid3">'
    + '<div class="mini"><div class="v">' + custs.length + '</div><div class="l">kupaca</div></div>'
    + '<div class="mini"><div class="v">' + returning + '</div><div class="l">povratnih</div></div>'
    + '<div class="mini"><div class="v">' + multi + '</div><div class="l">više narudžbi</div></div>'
    + '</div><div style="margin-top:14px">' + bars([['Plaćeno', paidN, 0, 'var(--green)'], ['Neplaćeno', A.n - paidN, 0, 'var(--red)']], r => r[1] + (r[0] === 'Neplaćeno' && A.unpaid ? ' · ' + eur(A.unpaid) : ''), A.n) + '</div></div></div>';
  // troškovi
  const cs = COSTS.map(c => [({ cost_bolid: 'Bolidi', cost_okvir: 'Okviri', cost_print: 'Print', cost_pakiranje: 'Pakiranje', cost_dostava: 'Dostava', cost_3dmat: '3D materijal', cost_kuglica: 'Kuglice', cost_privjesak: 'Privjesci', cost_kal: 'Kalendari', cost_lego: 'Lego', cost_folija: 'Ostalo' })[c], l.reduce((s, o) => s + num(o[c]), 0)]).filter(r => r[1] > 0).sort((x, y) => y[1] - x[1]);
  if (cs.length || ads) html += '<div class="sec"><div class="sec-h"><h2>Struktura troškova</h2></div><div class="card pad">' + bars(ads ? cs.concat([['Meta oglasi', ads, 0, 'var(--red)']]).sort((x, y) => y[1] - x[1]) : cs, r => eur(r[1])) + '</div></div>';
  // najveće narudžbe
  html += '<div class="sec"><div class="sec-h"><h2>Najveće narudžbe</h2></div><div class="card">' + [...l].sort((x, y) => num(y.cijena) - num(x.cijena)).slice(0, 5).map(orderRow).join('') + '</div></div>';
  v.innerHTML = html; bindReport(v, l);
}
function trendSvg(tm) {
  const W = 340, H = 150, pad = 18, n = tm.length, bw = (W - pad) / n, max = Math.max(1, ...tm.map(t => Math.max(t.rev, t.ads)));
  const y = v => H - 22 - (v / max) * (H - 36);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '">';
  tm.forEach((t, i) => {
    const x = pad + i * bw + bw * .18, w = bw * .64;
    s += '<rect x="' + x + '" y="' + y(t.rev) + '" width="' + w + '" height="' + Math.max(0, H - 22 - y(t.rev)) + '" rx="3" fill="currentColor" opacity="' + (t.sel ? 1 : .22) + '" style="color:var(--ink)"><title>' + t.k + ': ' + Math.round(t.rev) + ' €, ' + t.n + ' narudžbi</title></rect>';
    if (t.profit > 0) s += '<rect x="' + (x + w * .25) + '" y="' + y(t.profit) + '" width="' + w * .5 + '" height="' + Math.max(0, H - 22 - y(t.profit)) + '" rx="2" fill="#15803d" opacity="' + (t.sel ? .95 : .35) + '"/>';
    if (t.ads > 0) s += '<line x1="' + x + '" x2="' + (x + w) + '" y1="' + y(t.ads) + '" y2="' + y(t.ads) + '" stroke="#e10600" stroke-width="2.5" stroke-linecap="round" opacity="' + (t.sel ? 1 : .45) + '"/>';
    if (n <= 12 || i % 2 === 0) s += '<text x="' + (x + w / 2) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="9" fill="currentColor" style="color:var(--mute)" opacity=".8">' + MJS[t.d.getMonth()] + '</text>';
    if (t.sel && n <= 12) s += '<text x="' + (x + w / 2) + '" y="' + (y(t.rev) - 4) + '" text-anchor="middle" font-size="8.5" font-weight="700" fill="currentColor" style="color:var(--ink)">' + (t.rev >= 1000 ? (t.rev / 1000).toFixed(1) + 'k' : Math.round(t.rev)) + '</text>';
  });
  return s + '</svg>';
}
function bindReport(v, l) {
  v.querySelectorAll('[data-p]').forEach(b => b.addEventListener('click', () => { haptic(); RS.period = b.dataset.p; renderReport(); }));
  const f = v.querySelector('#rfilt'); if (f) f.addEventListener('click', reportFilterSheet);
  const c = v.querySelector('#rclear'); if (c) c.addEventListener('click', () => { Object.assign(RS, { okvir: '', platform: '', vozac: '', staza: '', paid: '' }); renderReport(); });
  v.querySelector('#rcsv').addEventListener('click', () => exportCsv(l));
}
function reportFilterSheet() {
  const uniq = k => [...new Set(D.orders.map(o => o[k]).filter(Boolean))].sort();
  const sel = (k, l, opts, lab) => '<div class="field"><label>' + l + '</label><select name="' + k + '"><option value="">Sve</option>' + opts.map(x => '<option value="' + esc(x) + '"' + (RS[k] === x ? ' selected' : '') + '>' + esc(lab ? lab(x) : x) + '</option>').join('') + '</select></div>';
  openSheet('Filteri izvještaja', '<div style="padding:0 16px"><div class="card">' + sel('okvir', 'Proizvod', uniq('okvir'), x => OKV[x] || x) + sel('platform', 'Platforma', uniq('platform')) + sel('vozac', 'Vozač', uniq('vozac')) + sel('staza', 'Staza', uniq('staza')) + sel('paid', 'Plaćeno', ['Da', 'Ne']) + '</div>'
    + '<div style="display:flex;gap:10px;margin-top:14px"><button class="btn ghost" id="fx">Očisti</button><button class="btn" id="fo">Primijeni</button></div></div>',
    b => {
      b.querySelector('#fo').addEventListener('click', () => { b.querySelectorAll('select').forEach(s => RS[s.name] = s.value); closeTop(); renderReport(); });
      b.querySelector('#fx').addEventListener('click', () => { Object.assign(RS, { okvir: '', platform: '', vozac: '', staza: '', paid: '' }); closeTop(); renderReport(); });
    });
}
function exportCsv(l) {
  const cols = ['id', 'created', 'fullname', 'name', 'platform', 'okvir', 'vozac', 'staza', 'godina', 'cijena', 'cost', 'paid', 'status', 'rok_isporuke', 'tracking', 'boxnow_status', 'grad'];
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const csv = '﻿' + cols.join(';') + '\n' + l.map(o => cols.map(c => q(o[c])).join(';')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'mauros-izvjestaj-' + new Date().toISOString().slice(0, 10) + '.csv'; document.body.appendChild(a); a.click(); a.remove();
  toast('⬇ CSV: ' + l.length + ' narudžbi');
}

/* ── IZBORNIK I RED IZMJENA ── */
function openMenu() {
  openSheet('MaurOS ' + VERSION,
    '<button class="opt" id="m1">↻ Osvježi podatke</button><button class="opt" id="m2">⏳ Izmjene na čekanju (' + Q.length + ')</button>'
    + '<div class="note" style="margin:10px 18px">Prijavljen: ' + esc((S && S.user && S.user.email) || '—') + '<br>Zadnje osvježeno: ' + (lastSync ? new Date(lastSync).toLocaleString('hr-HR') : '—') + '</div>'
    + '<button class="opt" id="m3" style="color:var(--red)">⎋ Odjava</button>',
    b => { b.querySelector('#m1').onclick = () => { closeTop(); loadAll(); }; b.querySelector('#m2').onclick = () => { closeTop(); setTimeout(openSyncSheet, 280); }; b.querySelector('#m3').onclick = () => { closeTop(); setTimeout(logout, 280); }; });
}
function openSyncSheet() {
  const desc = op => { const o = op.table === 'orders' ? D.orders.find(x => String(x.id) === String(op.id)) : null; return (op.kind === 'insert' ? 'Nova narudžba ' : op.table === 'orders' ? 'Narudžba ' : op.table + ' ') + (o ? oname(o) : '#' + op.id) + ': ' + Object.keys(op.patch || op.row || {}).filter(k => k !== 'id').slice(0, 5).join(', '); };
  openSheet('Sinkronizacija', (Q.length ? Q.map(op => '<div class="row"><div class="av" style="background:var(--' + (op.failed ? 'red' : 'amber') + 'Bg);color:var(--' + (op.failed ? 'red' : 'amber') + ')">' + (op.failed ? '!' : '⏳') + '</div><div class="rm"><b style="font-size:14px">' + esc(desc(op)) + '</b><div class="rs">' + esc(op.failed ? 'Greška: ' + op.failed : 'čeka slanje · ' + new Date(op.ts).toLocaleTimeString('hr-HR')) + '</div></div></div>').join('')
    + '<div style="padding:14px 16px"><button class="btn" id="qr">Pokušaj ponovno</button></div><div class="note" style="margin:0 18px 10px">Izmjene se nikad ne brišu same – ostaju ovdje dok ih baza ne prihvati.</div>'
    : '<div class="empty">✅ Sve izmjene su spremljene u bazu' + (lastSync ? '<br>osvježeno ' + new Date(lastSync).toLocaleTimeString('hr-HR', { hour: '2-digit', minute: '2-digit' }) : '') + '</div>'),
    b => { const r = b.querySelector('#qr'); if (r) r.onclick = () => { Q.forEach(x => delete x.failed); saveQ(); closeTop(); flush(); toast('Šaljem…'); }; });
}

/* ── START ── */
renderAll();
if (S) loadAll(); else authShow();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
